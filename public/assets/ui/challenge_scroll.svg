<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230">
  <defs>
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b7791f"/>
      <stop offset="30%" stop-color="#744210"/>
      <stop offset="100%" stop-color="#442605"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22"/>
    </linearGradient>
    <radialGradient id="parchmentGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fcf4e4"/>
      <stop offset="100%" stop-color="#f3e5c8"/>
    </radialGradient>
  </defs>

  <!-- Drop Shadow -->
  <rect x="10" y="14" width="560" height="210" rx="24" fill="#091422" opacity="0.45"/>

  <!-- Ornate Wood Frame -->
  <rect x="6" y="8" width="568" height="216" rx="24" fill="url(#woodBorder)" stroke="#f1c40f" stroke-width="3"/>

  <!-- Inner Parchment Area -->
  <rect x="18" y="20" width="544" height="192" rx="16" fill="url(#parchmentGrad)" stroke="#c5a059" stroke-width="2"/>

  <!-- Golden Rivets in Corners -->
  <circle cx="20" cy="22" r="5" fill="#f1c40f" stroke="#744210" stroke-width="1.5"/>
  <circle cx="560" cy="22" r="5" fill="#f1c40f" stroke="#744210" stroke-width="1.5"/>
  <circle cx="20" cy="210" r="5" fill="#f1c40f" stroke="#744210" stroke-width="1.5"/>
  <circle cx="560" cy="210" r="5" fill="#f1c40f" stroke="#744210" stroke-width="1.5"/>

  <!-- Top Decorative Header Plaque -->
  <rect x="150" y="2" width="280" height="34" rx="12" fill="url(#goldRibbon)" stroke="#744210" stroke-width="2.5"/>
  <circle cx="160" cy="19" r="3.5" fill="#ffffff"/>
  <circle cx="420" cy="19" r="3.5" fill="#ffffff"/>
</svg>
