<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="40%" stop-color="#f39c12"/>
      <stop offset="80%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>
  <!-- Drop Shadow -->
  <circle cx="40" cy="42" r="36" fill="#0c1829" opacity="0.5"/>
  <!-- Gold Rim Ring -->
  <circle cx="40" cy="40" r="36" fill="url(#goldRim)" stroke="#8e44ad" stroke-width="2"/>
  <!-- Inner Rim -->
  <circle cx="40" cy="40" r="30" fill="#1e272e" stroke="#ffffff" stroke-width="2"/>
  <!-- Specular Arc -->
  <path d="M 18 24 A 30 30 0 0 1 62 24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
</svg>
