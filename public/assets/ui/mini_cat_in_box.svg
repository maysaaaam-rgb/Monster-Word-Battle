<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <defs>
    <linearGradient id="boxOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e59866"/>
      <stop offset="60%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#a04000"/>
    </linearGradient>
    <linearGradient id="boxInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e2c00"/>
      <stop offset="100%" stop-color="#4e1f00"/>
    </linearGradient>
    <radialGradient id="catTabby" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dcdde1"/>
      <stop offset="100%" stop-color="#718093"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="80" cy="92" rx="60" ry="7" fill="#2c1d0c" opacity="0.25"/>

  <!-- Back Flaps of Cardboard Box -->
  <polygon points="32,48 18,32 58,32 60,48" fill="#c37d46" stroke="#6e2c00" stroke-width="1.5"/>
  <polygon points="100,48 102,32 142,32 128,48" fill="#c37d46" stroke="#6e2c00" stroke-width="1.5"/>

  <!-- Box Dark Interior (depth) -->
  <polygon points="30,48 130,48 126,88 34,88" fill="url(#boxInner)"/>

  <!-- Cute Cat Sitting INSIDE the Box -->
  <g transform="translate(80, 48)">
    <!-- Pointy Ears with Pink Inner -->
    <polygon points="-16,-12 -24,-30 -8,-20" fill="#a4b0be" stroke="#2f3542" stroke-width="1.5"/>
    <polygon points="-16,-14 -21,-26 -10,-19" fill="#ff6b81"/>
    <polygon points="16,-12 24,-30 8,-20" fill="#a4b0be" stroke="#2f3542" stroke-width="1.5"/>
    <polygon points="16,-14 21,-26 10,-19" fill="#ff6b81"/>

    <!-- Head -->
    <ellipse cx="0" cy="-6" rx="20" ry="17" fill="url(#catTabby)" stroke="#2f3542" stroke-width="2"/>

    <!-- Tabby Forehead Stripes -->
    <path d="M 0 -22 L 0 -14 M -6 -20 L -4 -15 M 6 -20 L 4 -15" stroke="#57606f" stroke-width="2" stroke-linecap="round"/>

    <!-- Expressive Eyes -->
    <ellipse cx="-8" cy="-8" rx="5" ry="6" fill="#2ed573" stroke="#2f3542" stroke-width="1.5"/>
    <circle cx="-8" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="-9" cy="-10" r="1.5" fill="#ffffff"/>

    <ellipse cx="8" cy="-8" rx="5" ry="6" fill="#2ed573" stroke="#2f3542" stroke-width="1.5"/>
    <circle cx="8" cy="-8" r="3.2" fill="#000000"/>
    <circle cx="7" cy="-10" r="1.5" fill="#ffffff"/>

    <!-- Pink Nose & Whiskers -->
    <polygon points="0,-1 -3,-4 3,-4" fill="#ff4757"/>
    <line x1="-5" y1="-2" x2="-22" y2="-4" stroke="#2f3542" stroke-width="1.5"/>
    <line x1="-5" y1="1" x2="-20" y2="4" stroke="#2f3542" stroke-width="1.5"/>
    <line x1="5" y1="-2" x2="22" y2="-4" stroke="#2f3542" stroke-width="1.5"/>
    <line x1="5" y1="1" x2="20" y2="4" stroke="#2f3542" stroke-width="1.5"/>
  </g>

  <!-- Front Face of Box -->
  <polygon points="28,48 132,48 126,90 34,90" fill="url(#boxOuter)" stroke="#6e2c00" stroke-width="2.5"/>

  <!-- Left & Right Front Folded Flaps -->
  <polygon points="28,48 8,42 12,68 30,58" fill="#e59866" stroke="#6e2c00" stroke-width="2"/>
  <polygon points="132,48 152,42 148,68 130,58" fill="#ba6f35" stroke="#6e2c00" stroke-width="2"/>

  <!-- Cat Paws Hanging Over Front Edge -->
  <ellipse cx="68" cy="50" rx="7" ry="5" fill="#ffffff" stroke="#2f3542" stroke-width="2"/>
  <line x1="66" y1="52" x2="66" y2="55" stroke="#718093" stroke-width="1.5"/>
  <line x1="70" y1="52" x2="70" y2="55" stroke="#718093" stroke-width="1.5"/>

  <ellipse cx="92" cy="50" rx="7" ry="5" fill="#ffffff" stroke="#2f3542" stroke-width="2"/>
  <line x1="90" y1="52" x2="90" y2="55" stroke="#718093" stroke-width="1.5"/>
  <line x1="94" y1="52" x2="94" y2="55" stroke="#718093" stroke-width="1.5"/>
</svg>
