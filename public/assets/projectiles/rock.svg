<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4b0be"/>
      <stop offset="45%" stop-color="#718093"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </linearGradient>
  </defs>

  <!-- Faceted Boulder Silhouette -->
  <polygon points="25,4 42,12 46,32 34,46 16,46 4,32 8,14" fill="url(#rockGrad)" stroke="#1e272e" stroke-width="3" stroke-linejoin="round"/>

  <!-- Interior Chisel Facets -->
