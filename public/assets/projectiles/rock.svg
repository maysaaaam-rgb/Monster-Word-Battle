  <line x1="42" y1="12" x2="28" y2="24" stroke="#a4b0be" stroke-width="1.5"/>
  <line x1="28" y1="24" x2="34" y2="46" stroke="#1e272e" stroke-width="2"/>
  <line x1="28" y1="24" x2="4" y2="32" stroke="#1e272e" stroke-width="2"/>

  <!-- Highlight Specks -->
  <circle cx="20" cy="14" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="34" cy="18" r="1.5" fill="#ffffff" opacity="0.6"/>
