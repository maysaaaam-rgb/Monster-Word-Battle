<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="shieldAura" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#fff59d" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ffd54f" stop-opacity="0.3"/>
      <stop offset="95%" stop-color="#ffb300" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Glowing Force-Field Outer Rim -->
  <circle cx="70" cy="70" r="66" fill="url(#shieldAura)" stroke="#ffe082" stroke-width="3"/>

  <!-- Energy Hexagon Grid overlay -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.4" fill="none">
    <polygon points="70,25 95,40 95,70 70,85 45,70 45,40"/>
    <polygon points="95,40 120,55 120,85 95,100 70,85 70,55"/>
    <polygon points="45,40 70,55 70,85 45,100 20,85 20,55"/>
    <polygon points="70,85 95,100 95,125 70,140 45,125 45,100"/>
  </g>

  <!-- Specular Gloss Arc -->
  <path d="M 28 42 A 55 55 0 0 1 112 42" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
</svg>
