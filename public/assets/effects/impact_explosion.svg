<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="blastGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffa65"/>
      <stop offset="70%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ee5253" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shockwave Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fffa65" stroke-width="4" opacity="0.8"/>

  <!-- Comic Impact Starburst -->
  <polygon points="50,4 62,35 96,20 78,50 96,78 64,68 50,96 36,68 4,78 22,50 4,20 38,35"
           fill="url(#blastGrad)" stroke="#c23616" stroke-width="3" stroke-linejoin="round"/>

  <!-- Center Flash -->
  <circle cx="50" cy="50" r="18" fill="#ffffff"/>
</svg>
