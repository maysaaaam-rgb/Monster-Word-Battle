<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="hillGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="70%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#006266"/>
    </linearGradient>
    <linearGradient id="hillGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7bed9f"/>
      <stop offset="60%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#1e824c"/>
    </linearGradient>
  </defs>

  <!-- Far Rolling Hills -->
  <path d="M 0 320
           C 160 210, 320 200, 480 240
           C 640 280, 800 190, 980 210
           C 1120 230, 1200 210, 1280 220
           L 1280 320 Z"
        fill="url(#hillGradBack)" opacity="0.9"/>

  <!-- Fairytale Cottage 1 (Left Hill) -->
  <g transform="translate(240, 195)">
    <!-- Shadow -->
    <ellipse cx="20" cy="35" rx="30" ry="6" fill="#006266" opacity="0.3"/>
    <!-- Wall -->
    <rect x="0" y="8" width="40" height="28" rx="2" fill="#fff7d6" stroke="#845012" stroke-width="2"/>
    <!-- Timber beams -->
    <line x1="0" y1="8" x2="40" y2="36" stroke="#845012" stroke-width="1.5"/>
    <line x1="40" y1="8" x2="0" y2="36" stroke="#845012" stroke-width="1.5"/>
    <!-- Red Roof -->
    <polygon points="20,-8 -6,10 46,10" fill="#eb3b5a" stroke="#841515" stroke-width="2"/>
    <!-- Chimney & Smoke -->
    <rect x="28" y="-12" width="6" height="12" fill="#845012"/>
    <circle cx="31" cy="-18" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="34" cy="-25" r="5" fill="#ffffff" opacity="0.4"/>
    <!-- Yellow Window with light -->
    <rect x="14" y="16" width="12" height="12" rx="2" fill="#fed330" stroke="#845012" stroke-width="1.5"/>
  </g>

  <!-- Fairytale Cottage 2 (Mid-Right Hill) -->
  <g transform="translate(860, 180)">
    <ellipse cx="18" cy="32" rx="26" ry="5" fill="#006266" opacity="0.3"/>
    <rect x="0" y="8" width="36" height="25" rx="2" fill="#ffeaa7" stroke="#845012" stroke-width="2"/>
    <polygon points="18,-6 -5,10 41,10" fill="#e17055" stroke="#841515" stroke-width="2"/>
    <rect x="12" y="15" width="10" height="10" rx="2" fill="#fed330" stroke="#845012" stroke-width="1.5"/>
  </g>

  <!-- Windmill (Right Hill) -->
  <g transform="translate(1060, 170)">
    <ellipse cx="15" cy="45" rx="25" ry="5" fill="#006266" opacity="0.3"/>
    <!-- Tower -->
    <polygon points="5,45 10,10 20,10 25,45" fill="#dfe6e9" stroke="#636e72" stroke-width="2"/>
    <!-- Conical Cap -->
    <polygon points="15,-2 7,12 23,12" fill="#c0392b" stroke="#781010" stroke-width="1.5"/>
    <!-- Blades Hub -->
    <circle cx="15" cy="14" r="3" fill="#2d3436"/>
    <!-- 4 Blades -->
    <line x1="15" y1="14" x2="-8" y2="-8" stroke="#845012" stroke-width="2.5"/>
    <polygon points="-8,-8 0,-6 -6,0" fill="#f5f6fa" stroke="#845012" stroke-width="1"/>
    <line x1="15" y1="14" x2="38" y2="36" stroke="#845012" stroke-width="2.5"/>
    <polygon points="38,36 30,38 36,30" fill="#f5f6fa" stroke="#845012" stroke-width="1"/>
    <line x1="15" y1="14" x2="-8" y2="36" stroke="#845012" stroke-width="2.5"/>
    <polygon points="-8,36 -6,28 0,34" fill="#f5f6fa" stroke="#845012" stroke-width="1"/>
    <line x1="15" y1="14" x2="38" y2="-8" stroke="#845012" stroke-width="2.5"/>
    <polygon points="38,-8 36,0 30,-6" fill="#f5f6fa" stroke="#845012" stroke-width="1"/>
  </g>

  <!-- Near Rolling Hills -->
  <path d="M 0 320
           C 200 230, 420 280, 640 230
           C 860 180, 1080 250, 1280 210
           L 1280 320 Z"
        fill="url(#hillGradFront)"/>

  <!-- Midground Clump Trees -->
  <g transform="translate(140, 240)">
    <rect x="10" y="20" width="6" height="24" fill="#845012" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#10ac84"/>
    <circle cx="4" cy="16" r="14" fill="#1dd1a1"/>
    <circle cx="22" cy="16" r="14" fill="#1dd1a1"/>
  </g>
  <g transform="translate(480, 235)">
    <rect x="8" y="16" width="6" height="20" fill="#845012" rx="2"/>
    <circle cx="11" cy="8" r="17" fill="#10ac84"/>
    <circle cx="3" cy="12" r="12" fill="#1dd1a1"/>
    <circle cx="19" cy="12" r="12" fill="#1dd1a1"/>
  </g>
  <g transform="translate(760, 215)">
    <rect x="10" y="20" width="6" height="24" fill="#845012" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#10ac84"/>
    <circle cx="22" cy="16" r="14" fill="#1dd1a1"/>
  </g>
  <g transform="translate(1180, 215)">
    <rect x="10" y="20" width="6" height="24" fill="#845012" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#10ac84"/>
    <circle cx="4" cy="16" r="14" fill="#1dd1a1"/>
  </g>
</svg>
