<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 24" width="36" height="24">
  <defs>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="70%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <ellipse cx="18" cy="14" rx="10" ry="7" fill="url(#birdGrad)" stroke="#0d47a1" stroke-width="1.2"/>
  <!-- Head -->
  <circle cx="26" cy="10" r="5" fill="url(#birdGrad)" stroke="#0d47a1" stroke-width="1.2"/>
  <!-- Beak -->
  <polygon points="31,9 36,11 31,13" fill="#ffb300"/>
  <!-- Eye -->
  <circle cx="27" cy="9" r="1.2" fill="#000000"/>
  <!-- Wings (Flapping upwards) -->
  <path d="M 12 12 Q 10 2, 2 2 Q 8 8, 14 14 Z" fill="#90caf9" stroke="#0d47a1" stroke-width="1.2"/>
  <path d="M 16 12 Q 18 0, 10 0 Q 14 8, 18 14 Z" fill="#64b5f6" stroke="#0d47a1" stroke-width="1.2"/>
  <!-- Tail -->
  <polygon points="8,15 1,12 1,18" fill="#1565c0"/>
</svg>
