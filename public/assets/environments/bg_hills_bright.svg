<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="brightHillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8e063"/>
      <stop offset="60%" stop-color="#56ab2f"/>
      <stop offset="100%" stop-color="#2d6a1d"/>
    </linearGradient>
    <linearGradient id="brightHillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c6f68d"/>
      <stop offset="45%" stop-color="#7bd338"/>
      <stop offset="100%" stop-color="#3b8b1b"/>
    </linearGradient>
  </defs>

  <!-- Far Rolling Hills -->
  <path d="M 0 320
           C 180 200, 360 190, 540 230
           C 720 270, 880 180, 1040 200
           C 1160 215, 1220 200, 1280 210
           L 1280 320 Z"
        fill="url(#brightHillBack)"/>

  <!-- Fairytale Cottage 1 (Left Hill) -->
  <g transform="translate(240, 185)">
    <ellipse cx="20" cy="35" rx="30" ry="6" fill="#1b4d0e" opacity="0.3"/>
    <rect x="0" y="8" width="40" height="28" rx="3" fill="#fffbe7" stroke="#795548" stroke-width="2"/>
    <line x1="0" y1="8" x2="40" y2="36" stroke="#8d6e63" stroke-width="1.5"/>
    <line x1="40" y1="8" x2="0" y2="36" stroke="#8d6e63" stroke-width="1.5"/>
    <polygon points="20,-8 -6,10 46,10" fill="#ff5252" stroke="#b71c1c" stroke-width="2"/>
    <rect x="28" y="-12" width="6" height="12" fill="#795548"/>
    <circle cx="31" cy="-18" r="4" fill="#ffffff" opacity="0.6"/>
    <circle cx="34" cy="-25" r="5" fill="#ffffff" opacity="0.4"/>
    <rect x="14" y="16" width="12" height="12" rx="2" fill="#ffee58" stroke="#795548" stroke-width="1.5"/>
  </g>

  <!-- Fairytale Cottage 2 (Mid-Right Hill) -->
  <g transform="translate(870, 175)">
    <ellipse cx="18" cy="32" rx="26" ry="5" fill="#1b4d0e" opacity="0.3"/>
    <rect x="0" y="8" width="36" height="25" rx="3" fill="#fff9c4" stroke="#795548" stroke-width="2"/>
    <polygon points="18,-6 -5,10 41,10" fill="#ff7043" stroke="#b71c1c" stroke-width="2"/>
    <rect x="12" y="15" width="10" height="10" rx="2" fill="#ffee58" stroke="#795548" stroke-width="1.5"/>
  </g>

  <!-- Windmill (Right Hill) -->
  <g transform="translate(1070, 160)">
    <ellipse cx="15" cy="45" rx="25" ry="5" fill="#1b4d0e" opacity="0.3"/>
    <polygon points="5,45 10,10 20,10 25,45" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
    <polygon points="15,-2 7,12 23,12" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <circle cx="15" cy="14" r="3" fill="#37474f"/>
    <!-- 4 Blades -->
    <line x1="15" y1="14" x2="-8" y2="-8" stroke="#795548" stroke-width="2.5"/>
    <polygon points="-8,-8 0,-6 -6,0" fill="#ffffff" stroke="#795548" stroke-width="1"/>
    <line x1="15" y1="14" x2="38" y2="36" stroke="#795548" stroke-width="2.5"/>
    <polygon points="38,36 30,38 36,30" fill="#ffffff" stroke="#795548" stroke-width="1"/>
    <line x1="15" y1="14" x2="-8" y2="36" stroke="#795548" stroke-width="2.5"/>
    <polygon points="-8,36 -6,28 0,34" fill="#ffffff" stroke="#795548" stroke-width="1"/>
    <line x1="15" y1="14" x2="38" y2="-8" stroke="#795548" stroke-width="2.5"/>
    <polygon points="38,-8 36,0 30,-6" fill="#ffffff" stroke="#795548" stroke-width="1"/>
  </g>

  <!-- Near Rolling Hills -->
  <path d="M 0 320
           C 220 220, 440 270, 640 220
           C 840 170, 1060 240, 1280 200
           L 1280 320 Z"
        fill="url(#brightHillFront)"/>

  <!-- Sunny Clump Trees -->
  <g transform="translate(130, 230)">
    <rect x="10" y="20" width="6" height="24" fill="#795548" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#43a047"/>
    <circle cx="4" cy="16" r="14" fill="#66bb6a"/>
    <circle cx="22" cy="16" r="14" fill="#66bb6a"/>
  </g>
  <g transform="translate(470, 225)">
    <rect x="8" y="16" width="6" height="20" fill="#795548" rx="2"/>
    <circle cx="11" cy="8" r="17" fill="#43a047"/>
    <circle cx="3" cy="12" r="12" fill="#66bb6a"/>
    <circle cx="19" cy="12" r="12" fill="#66bb6a"/>
  </g>
  <g transform="translate(750, 205)">
    <rect x="10" y="20" width="6" height="24" fill="#795548" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#43a047"/>
    <circle cx="22" cy="16" r="14" fill="#66bb6a"/>
  </g>
  <g transform="translate(1190, 205)">
    <rect x="10" y="20" width="6" height="24" fill="#795548" rx="2"/>
    <circle cx="13" cy="12" r="20" fill="#43a047"/>
    <circle cx="4" cy="16" r="14" fill="#66bb6a"/>
  </g>
</svg>
