<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="catBlueGrad" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#54a0ff"/>
      <stop offset="60%" stop-color="#2e86de"/>
      <stop offset="100%" stop-color="#0952a5"/>
    </radialGradient>
    <linearGradient id="catEarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2e86de"/>
      <stop offset="100%" stop-color="#54a0ff"/>
    </linearGradient>
    <linearGradient id="catInnerEar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9ff3"/>
      <stop offset="100%" stop-color="#feca57"/>
    </linearGradient>
  </defs>

  <!-- Curving Cat Tail (Behind body, curls up on left) -->
  <path d="M 28 92 C 8 86, -2 68, 6 52 C 14 36, 26 40, 20 52 C 14 62, 18 76, 32 84 Z"
        fill="url(#catBlueGrad)" stroke="#0c2461" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Fluffy White Tail Tip -->
  <path d="M 6 52 C 14 36, 26 40, 20 52 C 16 58, 12 58, 6 52 Z"
        fill="#f8f9fa" stroke="#0c2461" stroke-width="2.5"/>

  <!-- Left Cat Ear (Triangular, Pointy, Cute) -->
  <path d="M 26 48 L 14 12 C 18 10, 36 18, 48 34 Z"
        fill="url(#catEarGrad)" stroke="#0c2461" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Left Inner Ear Cushion (Pink) -->
  <path d="M 26 42 L 18 18 C 22 17, 32 23, 40 32 Z"
        fill="url(#catInnerEar)" opacity="0.9"/>

  <!-- Right Cat Ear (Triangular, Pointy, Cute) -->
  <path d="M 114 48 L 126 12 C 122 10, 104 18, 92 34 Z"
        fill="url(#catEarGrad)" stroke="#0c2461" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Right Inner Ear Cushion (Pink) -->
  <path d="M 114 42 L 122 18 C 118 17, 108 23, 100 32 Z"
        fill="url(#catInnerEar)" opacity="0.9"/>

  <!-- Main Cat Body (Chubby Arcade Mascot with Cheek Fur Tufts) -->
  <path d="M 70 20
           C 96 20, 116 34, 122 56
           C 126 62, 134 66, 128 76
           C 134 82, 126 92, 122 96
           C 118 116, 98 126, 70 126
           C 42 126, 22 116, 18 96
           C 14 92, 6 82, 12 76
           C 6 66, 14 62, 18 56
           C 24 34, 44 20, 70 20 Z"
        fill="url(#catBlueGrad)" stroke="#0c2461" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Forehead Highlights -->
  <path d="M 44 26 C 58 22, 82 22, 96 26 C 88 23, 52 23, 44 26 Z" fill="#c7ecee" opacity="0.75"/>

  <!-- Cute Cat Whiskers -->
  <path d="M 14 74 L 32 78" stroke="#0c2461" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 12 84 L 30 84" stroke="#0c2461" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 126 74 L 108 78" stroke="#0c2461" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 128 84 L 110 84" stroke="#0c2461" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cute Pink Cat Nose -->
  <polygon points="70,72 65,65 75,65" fill="#ff6b81" stroke="#0c2461" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="36" cy="85" rx="8" ry="4.5" fill="#ff7675" opacity="0.65"/>
  <ellipse cx="104" cy="85" rx="8" ry="4.5" fill="#ff7675" opacity="0.65"/>
</svg>
