           C 106 24, 126 48, 126 78
           C 126 108, 108 126, 70 126
           C 32 126, 14 108, 14 78
           C 14 48, 34 24, 70 24 Z"
        fill="url(#redBodyGrad)" stroke="#5c1919" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Fiery Tail Tip Peeking -->
  <path d="M 118 90 C 135 92, 138 78, 130 72 C 122 76, 118 84, 118 90 Z" fill="#feca57" stroke="#b33939" stroke-width="2"/>

  <!-- Highlights & Warm Shading -->
