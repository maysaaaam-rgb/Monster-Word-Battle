<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="redBodyGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="65%" stop-color="#ee5253"/>
      <stop offset="100%" stop-color="#b33939"/>
    </radialGradient>
    <linearGradient id="redHornGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="60%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#fffa65"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="70" cy="132" rx="54" ry="8" fill="#5c1919" opacity="0.4"/>

  <!-- Curved Fiery Horns -->
  <path d="M 28 44 C 14 26, 8 10, 22 4 C 36 0, 44 22, 44 38 Z" fill="url(#redHornGrad)" stroke="#841515" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 112 44 C 126 26, 132 10, 118 4 C 104 0, 96 22, 96 38 Z" fill="url(#redHornGrad)" stroke="#841515" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Round Chubby Body -->
